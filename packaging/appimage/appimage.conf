# Product settings for build-appimage.sh (sourced by bash).
APP_NAME="Extended-4D-Editor"             # AppImage file name prefix
PACKAGE="extended-4d-editor"                   # Python distribution name (pyproject.toml)
MODULE="fourdvr_studio"                     # import name, used by AppRun
EXTRAS="[all]"                              # audio (bass output, sound-track decoding) and serial (USB DMX, ESP32 serial links)
DESKTOP_FILE="extended-4d-editor.desktop"
ICON_NAME="extended-4d-editor"
BUNDLE_X11_HELPERS=1                        # desktop application (Qt): bundle the xcb helper libraries
