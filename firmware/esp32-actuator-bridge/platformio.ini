; Extended 4D Editor - ESP32 firmware: actuator bridge and/or effects node (Arduino framework).
;   pio run -e wt32-eth01                 platform only, WT32-ETH01 (ESP32 + LAN8720 Ethernet)
;   pio run -e wt32-eth01-dmx             platform + a DMX line for its effect devices
;   pio run -e wt32-eth01-fx              effects-only node: DMX line + audio output (shaker / subwoofer)
;   pio run -e esp32dev-wifi-fx           effects-only node on a plain ESP32 over Wi-Fi
;   pio run -e esp32dev-wifi-all          platform + DMX + audio on one ESP32 over Wi-Fi (bench tests)
;   pio run -e <name> -t upload           flash over USB
;   pio test -e native                    run the portable unit tests on the PC
; Per-device values (FDVR_PLATFORM_ID, IP address, stroke, pins ...) live in include/config.h or can be
; given here with build_flags, e.g.  -D FDVR_PLATFORM_ID=3

[platformio]
default_envs = wt32-eth01

[env]
framework = arduino
platform = espressif32@^6.9.0
monitor_speed = 921600
lib_deps =
build_flags = -Wall -Wextra

[env:wt32-eth01]
board = wt32-eth01
build_flags = ${env.build_flags} -D FDVR_NET_ETHERNET=1 -D FDVR_NET_WIFI=0

[env:olimex-esp32-poe]
board = esp32-poe
build_flags = ${env.build_flags} -D FDVR_NET_ETHERNET=1 -D FDVR_NET_WIFI=0 -D FDVR_ETH_PHY_ADDR=0 -D FDVR_ETH_PHY_POWER=12

[env:esp32dev-wifi]
; bench testing only (Wi-Fi jitter is unsuitable for passenger shows)
board = esp32dev
build_flags = ${env.build_flags} -D FDVR_NET_ETHERNET=0 -D FDVR_NET_WIFI=1

[env:wt32-eth01-dmx]
; platform + DMX line: the RS-485 transceiver's DI on IO17
board = wt32-eth01
build_flags = ${env.build_flags} -D FDVR_NET_ETHERNET=1 -D FDVR_NET_WIFI=0 -D FDVR_HAS_DMX=1 -D FDVR_DMX_TX_PIN=17

[env:wt32-eth01-fx]
; effects-only node (no platform): DMX on IO17, I2S DAC on IO32 (BCK) / IO33 (WS) / IO4 (DATA)
board = wt32-eth01
build_flags = ${env.build_flags} -D FDVR_NET_ETHERNET=1 -D FDVR_NET_WIFI=0 -D FDVR_HAS_ACTUATORS=0 -D FDVR_HAS_DMX=1 -D FDVR_HAS_AUDIO=1

[env:esp32dev-wifi-fx]
; effects-only node over Wi-Fi: fine for DMX devices and bass; 200 ms of sound buffered against Wi-Fi jitter
board = esp32dev
build_flags = ${env.build_flags} -D FDVR_NET_ETHERNET=0 -D FDVR_NET_WIFI=1 -D FDVR_HAS_ACTUATORS=0 -D FDVR_HAS_DMX=1 -D FDVR_HAS_AUDIO=1 -D FDVR_AUDIO_BUFFER_MS=200

[env:esp32dev-wifi-all]
; one ESP32 for everything, over Wi-Fi (bench tests: Wi-Fi jitter is unsuitable for moving passengers)
; I2S DAC on GPIO26 (BCK) / GPIO25 (WS) / GPIO27 (DATA), DMX on GPIO17
board = esp32dev
build_flags = ${env.build_flags} -D FDVR_NET_ETHERNET=0 -D FDVR_NET_WIFI=1 -D FDVR_HAS_DMX=1 -D FDVR_HAS_AUDIO=1 -D FDVR_I2S_BCK_PIN=26 -D FDVR_I2S_WS_PIN=25 -D FDVR_I2S_DOUT_PIN=27 -D FDVR_AUDIO_BUFFER_MS=200

[env:esp32dev-serial]
; USB serial link only (Motion Controller address: serial:///dev/ttyUSB0?baud=921600)
board = esp32dev
build_flags = ${env.build_flags} -D FDVR_NET_ETHERNET=0 -D FDVR_NET_WIFI=0

[env:native]
; host unit tests of lib/fourdvr_link and lib/fourdvr_fx (no hardware needed); see also test/host/Makefile
platform = native
framework =
build_flags = -std=c++17 -Wall -Wextra
test_framework = custom
